<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_ds/organic-95994641-e423-4271-b7f1-7d83110eab40/styles.css">
<script src="_ds/organic-95994641-e423-4271-b7f1-7d83110eab40/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
<style>
.nav-toggle-input { position:absolute; opacity:0; pointer-events:none; }
.nav-toggle-btn { display:none; }
.nav-links { display:flex; align-items:center; gap:var(--space-4); }
@media (max-width: 768px) {
  .nav-toggle-btn {
    display:flex; flex-direction:column; justify-content:center; gap:5px;
    width:36px; height:36px; padding:0; border:none; background:transparent;
    cursor:pointer; margin-left:auto;
  }
  .nav-toggle-btn span { display:block; width:22px; height:2px; background:var(--color-text); border-radius:2px; }
  .nav-links {
    position:absolute; top:100%; left:0; right:0;
    flex-direction:column !important; align-items:flex-start !important;
    background:var(--color-surface); box-shadow:var(--shadow-lg);
    padding:var(--space-4) var(--space-6); gap:var(--space-3) !important;
    display:none;
  }
  .nav-toggle-input:checked ~ .nav-links { display:flex; }
  .nav-links .btn-primary { width:100%; text-align:center; }
}
</style>
</helmet>
<nav class="nav" style="padding-inline: max(var(--space-6), calc((100% - 1200px) / 2 + var(--space-6))); position:relative; z-index:50;">
  <a href="./Home.dc.html" style="display:flex;align-items:center;gap:var(--space-2);text-decoration:none;color:inherit;">
    <image-slot id="jomovate-icon" shape="rect" src="./assets/jomovate-icon.webp" fit="contain" placeholder="Icon" style="width:32px;height:32px;flex-shrink:0;"></image-slot>
    <span style="font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:20px;color:var(--color-text);">Jomovate</span>
  </a>
  <input type="checkbox" id="nav-toggle" class="nav-toggle-input">
  <label for="nav-toggle" class="nav-toggle-btn" aria-label="Toggle menu"><span></span><span></span><span></span></label>
  <div class="nav-links">
    <a href="./Home.dc.html" aria-current="{{ curHome }}">Home</a>
    <a href="./Products.dc.html" aria-current="{{ curProducts }}">Products</a>
    <a href="./Services.dc.html" aria-current="{{ curServices }}">Services</a>
    <a href="./About.dc.html" aria-current="{{ curAbout }}">About</a>
    <a href="./Insights.dc.html" aria-current="{{ curInsights }}">Insights</a>
    <a href="./Contact.dc.html" class="btn btn-primary" style="text-decoration:none;">Start a Conversation</a>
  </div>
</nav>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;products&quot;,&quot;services&quot;,&quot;about&quot;,&quot;insights&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active;
    const cur = (k) => (a === k ? 'page' : undefined);
    return {
      curHome: cur('home'),
      curProducts: cur('products'),
      curServices: cur('services'),
      curAbout: cur('about'),
      curInsights: cur('insights'),
    };
  }
}
</script>
</body>
</html>
